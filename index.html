<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAGE EDITOR</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css">
</head>

<body>
    <main>
        <section>
            <div class="left">
                <div class="top">
                    <label for="image-input" id="white" class="btn">
                        Choose image
                        <input type="file" id="image-input" accept="image/*" hidden>
                    </label>
                    <button class="btn" id="reset-btn"> Reset </button>
                    <button class="btn" id="download-btn"> Download </button>
                    <button class="btn" id="toggle-btn">Before</button>
                    <button class="btn" id="remove-bg-btn">
                        Remove Background
                    </button>

                    <button class="btn" id="rotate-left-btn">
                        ↺ Rotate
                    </button>

                    <button class="btn" id="rotate-right-btn">
                        ↻ Rotate
                    </button>

                    <button class="btn" id="flip-horizontal-btn">
                        ↔ Flip H
                    </button>

                    <button class="btn" id="flip-vertical-btn">
                        ↕ Flip V
                    </button>
                    <button class="btn" id="undo-btn">
                        Undo
                    </button>

                    <button class="btn" id="redo-btn">
                        Redo
                    </button>



                    <button class="btn mobile-filter-btn">
                        🎛 Filters
                    </button>
                </div>
                <div class="buttom">
                    <div class="placeholder-image">
                        <i class="ri-image-line" style="font-size: 10rem" ;></i>
                        <p>No image chosen</p>
                    </div>
                    <canvas id="image-canvas" style="display:none;"> </canvas>
                </div>
            </div>
            <div class="right">
                <div class="filter-header">


                    <div class="presets"></div>

                    <button id="close-filters">
                        ✕
                    </button>
                </div>
                <div class="filters">
                    <h2 style="align-items: center;">Filters</h2>
                    <div class="filter">

                    </div>
                </div>


        </section>

    </main>


    <div class="overlay"></div>
    <script src="script.js"></script>


</body>

</html>
