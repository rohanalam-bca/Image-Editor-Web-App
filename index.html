<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAGE EDITOR</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section>
            <div class="left">
                <div class="top">
                    <label for="image-input" class="btn">
                        Choose image
                        <input type="file" id="image-input" accept="image/*" hidden>
                    </label>
                    <button class="btn" id="reset-btn"> Reset </button>
                    <button class="btn" id="download-btn"> Download </button>
                    <button class="btn" id="toggle-btn">Before</button>
                    <button class="btn" id="remove-bg-btn">
                        Remove Background
                    </button>
                </div>
                <div class="buttom">
                    <div class="placeholder-image">
                        <i class="ri-image-line" style="font-size: 10rem" ;></i>
                        <p>No image chosen</p>
                    </div>
                    <canvas id="image-canvas" style="display:none;"> </canvas>
                </div>
            </div>
            <div class="right">
                <h2 style="text-align: center" ;>Filters</h2>
                <div class="filters">


                    <div class="filter">

                    </div>


                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>

    <script>



    </script>
</body>

</html>
